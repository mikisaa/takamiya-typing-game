name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suites
        run: npm test

      - name: Verify Question Bundle Integrity
        run: node -e 'import { runBundleDriftTest } from "./tests/testQuestionBundleDrift.js"; const r = runBundleDriftTest(); if (r.failed > 0) process.exit(1);'

      - name: Validate Production Artifact
        run: |
          node -e '
          import fs from "fs";
          if (!fs.existsSync("src/index.html") || !fs.existsSync("src/main.js") || !fs.existsSync("src/index.css")) {
            console.error("Critical production entrypoints missing in src/");
            process.exit(1);
          }
          console.log("Production artifact validated successfully.");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
