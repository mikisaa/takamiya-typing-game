  function getRandomScaffoldLoad(lastType = "") {

  // src/visual/animation/extraEventManager.js
  var ExtraEventManager = class {
    /**
     * @param {object} [options]
     * @param {function} [options.randomFn] - Deterministic random function for testing
     * @param {object} [options.config] - Override configuration
     */
    constructor({ randomFn = Math.random, config = EXTRA_CONFIG } = {}) {
      this.randomFn = randomFn;
      this.config = config;
      this.activeEvents = [];
      this.nextEventId = 1;
      this.lastEventType = null;
      this.rainbowState = {
        active: false,
        elapsed: 0,
        duration: this.config.durations.rainbow,
        opacity: 0
      };
    }
    /**
     * Resets all active events and state on session end or replay
     */
    reset() {
      this.activeEvents = [];
      this.nextEventId = 1;
      this.lastEventType = null;
      this.rainbowState = {
        active: false,
        elapsed: 0,
        duration: this.config.durations.rainbow,
        opacity: 0
      };
    }
    /**
     * Checks if an event of the given type is currently active
     * @param {string} type
     * @returns {boolean}
     */
    isTypeActive(type) {
      return this.activeEvents.some((e) => e.type === type);
    }
    /**
     * Notification of a question success in EXTRA stage (correctCount >= 34)
     * @param {number} correctCount
     */
    onExtraSuccess(correctCount = 34) {
      if (correctCount < 34) return;
      if (this.randomFn() < this.config.rainbowProbability) {
        this.triggerRainbow();
      }
      if (correctCount === 34) {
        if (!this.isTypeActive(EXTRA_EVENT_TYPES.BALLOONS)) {
          this.spawnEvent(EXTRA_EVENT_TYPES.BALLOONS);
        }
        return;
      }
      if (this.activeEvents.length >= this.config.maxConcurrentDynamicEvents) {
        return;
      }
      if (this.randomFn() < this.config.skydiverProbability && !this.isTypeActive(EXTRA_EVENT_TYPES.SKYDIVER)) {
        this.spawnEvent(EXTRA_EVENT_TYPES.SKYDIVER);
        return;
      }
      const availableTypes = [
        EXTRA_EVENT_TYPES.AIRPLANE,
        EXTRA_EVENT_TYPES.HELICOPTER,
        EXTRA_EVENT_TYPES.BALLOONS
      ].filter((t) => !this.isTypeActive(t));
      if (availableTypes.length === 0) return;
      const selectedType = this.pickWeightedEvent(availableTypes);
      if (selectedType) {
        this.spawnEvent(selectedType);
      }
    }
    /**
     * Triggers or refreshes the background rainbow overlay
     */
    triggerRainbow() {
      this.rainbowState.active = true;
      this.rainbowState.elapsed = 0;
    }
    /**
     * Weighted random event selection among available types
     * @param {string[]} candidates
     * @returns {string}
     */
    pickWeightedEvent(candidates) {
      if (candidates.length === 1) return candidates[0];
      let totalWeight = 0;
      for (const type of candidates) {
        totalWeight += this.config.dynamicEventWeights[type] || 30;
      }
      let rnd = this.randomFn() * totalWeight;
      for (const type of candidates) {
        const w = this.config.dynamicEventWeights[type] || 30;
        if (rnd <= w) return type;
        rnd -= w;
      }
      return candidates[0];
    }
    /**
     * Spawns a new dynamic event instance
     * @param {string} type
     */
    spawnEvent(type) {
      const id = this.nextEventId++;
      const duration = this.config.durations[type.toLowerCase()] || 8;
      let initialX = 0;
      let initialY = 0;
      switch (type) {
        case EXTRA_EVENT_TYPES.AIRPLANE:
          initialX = -50;
          initialY = this.config.airspace.airplaneY;
          break;
        case EXTRA_EVENT_TYPES.HELICOPTER:
          initialX = -50;
          initialY = this.config.airspace.helicopterBaseY;
          break;
        case EXTRA_EVENT_TYPES.BALLOONS:
          initialX = 140 + this.randomFn() * 450;
          initialY = this.config.airspace.balloonsStartY;
          break;
        case EXTRA_EVENT_TYPES.SKYDIVER:
          initialX = 200 + this.randomFn() * 350;
          initialY = this.config.airspace.skydiverStartY;
          break;
      }
      const eventObj = {
        id,
        type,
        elapsed: 0,
        duration,
        x: initialX,
        y: initialY,
        startX: initialX,
        startY: initialY
      };
      this.activeEvents.push(eventObj);
      this.lastEventType = type;
    }
    /**
     * Updates all active event positions and animations on frame tick
     * @param {number} deltaSeconds
     */
    update(deltaSeconds) {
      if (this.rainbowState.active) {
        this.rainbowState.elapsed += deltaSeconds;
        const t = this.rainbowState.elapsed;
        const fadeDur = this.config.durations.rainbowFade;
        if (t < fadeDur) {
          this.rainbowState.opacity = t / fadeDur;
        } else if (t < this.rainbowState.duration - fadeDur) {
          this.rainbowState.opacity = 1;
        } else if (t < this.rainbowState.duration) {
          const remaining = this.rainbowState.duration - t;
          this.rainbowState.opacity = Math.max(0, remaining / fadeDur);
        } else {
          this.rainbowState.active = false;
          this.rainbowState.opacity = 0;
        }
      }
      for (let i = this.activeEvents.length - 1; i >= 0; i--) {
        const ev = this.activeEvents[i];
        ev.elapsed += deltaSeconds;
        const p = Math.min(1, ev.elapsed / ev.duration);
        switch (ev.type) {
          case EXTRA_EVENT_TYPES.AIRPLANE:
            ev.x = -50 + p * 1e3;
            break;
          case EXTRA_EVENT_TYPES.HELICOPTER:
            if (p < 0.4) {

        difficulty: activeRankingDifficulty,
        limit: 10,
        playerName: rememberedName || null
      });
      if (token !== rankingRequestToken) {
        return;
      }
      if (!res || !res.ok || !res.data) {
        if (rankingLoading) rankingLoading.style.display = "none";
        if (rankingError) rankingError.style.display = "flex";
        return;
      }
      rankingCache.set(cacheKey, res.data);
      renderRankingData(res.data);
    } catch (err) {
      if (token !== rankingRequestToken) return;
      if (rankingLoading) rankingLoading.style.display = "none";
      if (rankingError) rankingError.style.display = "flex";
    }
  }
  if (btnOpenRanking) {
    btnOpenRanking.addEventListener("click", () => {
      activeRankingPeriod = "MONTHLY";
      activeRankingDifficulty = "BEGINNER";
      showScreen("ranking");
      loadAndDisplayRankings(false);
    });
  }
  if (btnResultRanking) {
    btnResultRanking.addEventListener("click", () => {
      activeRankingPeriod = "MONTHLY";
      activeRankingDifficulty = activeSession && activeSession.difficulty ? activeSession.difficulty : selectedDifficulty;
      showScreen("ranking");
      loadAndDisplayRankings(true);
    });
  }
  if (tabPeriodMonthly) {
    tabPeriodMonthly.addEventListener("click", () => {
      if (activeRankingPeriod !== "MONTHLY") {
        activeRankingPeriod = "MONTHLY";
        loadAndDisplayRankings(false);
      }
    });
  }
  if (tabPeriodAllTime) {
    tabPeriodAllTime.addEventListener("click", () => {
      if (activeRankingPeriod !== "ALL_TIME") {
        activeRankingPeriod = "ALL_TIME";
        loadAndDisplayRankings(false);
      }
    });
  }
  if (tabDiffBeginner) {
    tabDiffBeginner.addEventListener("click", () => {
      if (activeRankingDifficulty !== "BEGINNER") {
        activeRankingDifficulty = "BEGINNER";
        loadAndDisplayRankings(false);
      }
    });
  }
  if (tabDiffIntermediate) {
    tabDiffIntermediate.addEventListener("click", () => {
      if (activeRankingDifficulty !== "INTERMEDIATE") {
        activeRankingDifficulty = "INTERMEDIATE";
        loadAndDisplayRankings(false);
      }
    });
  }
  if (tabDiffAdvanced) {
    tabDiffAdvanced.addEventListener("click", () => {
      if (activeRankingDifficulty !== "ADVANCED") {
        activeRankingDifficulty = "ADVANCED";
        loadAndDisplayRankings(false);
      }
    });
  }
  if (btnRankingRetry) {
    btnRankingRetry.addEventListener("click", () => {
      loadAndDisplayRankings(true);
    });
  }
  if (btnRankingBackToTitle) {
    btnRankingBackToTitle.addEventListener("click", () => {
      showScreen("title");
    });
  }
  if (typeof window !== "undefined") {
    window.__setDevCorrectCount = (count) => {
      if (visualScene) visualScene.renderCityPanorama(count);
    };
    window.__triggerExtraEvent = (type) => {
      if (visualScene && visualScene.extraManager) visualScene.extraManager.spawnEvent(type);
    };
    window.__triggerRainbow = () => {
      if (visualScene && visualScene.extraManager) visualScene.extraManager.triggerRainbow();
    };
    window.__getActiveSession = () => activeSession;
    window.__getVisualScene = () => visualScene;
    window.__getExtraManager = () => visualScene?.extraManager;
  }
})();

</script>
