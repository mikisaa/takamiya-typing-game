<style>
/* TAKAMIYA TYPING GAME v1.2.0 — Unified UI & Realistic Scene Stylesheet */
/* ==========================================================================
   TakamiyaTypingGame — Phase 6 Unified 5-Color System & White Design Palette
   Authoritative Palette Tokens:
     WHITE:  #FFFFFF (Global Background)
     PALE_1: #F5FBDA (Large Panel Background / Light Highlight)
     PALE_2: #D9EFBD (Secondary Panel / Hover / Sub Area)
     ACCENT: #B9D175 (Main Accent / Progress / Active Decoration)
     DARK:   #450C3F (Primary Text / Border / Icon / Outline / Error)
   ========================================================================== */

:root {
  /* 5 Core Color Tokens */
  --white: #FFFFFF;
  --pale-1: #F5FBDA;
  --pale-2: #D9EFBD;
  --accent: #B9D175;
  --dark: #450C3F;

  /* Functional Mappings */
  --bg: var(--white);
  --panel: var(--pale-1);
  --panel-sub: var(--pale-2);
  --panel-border: var(--dark);
  --panel-border-sub: var(--accent);
  --text: var(--dark);
  --text-muted: rgba(69, 12, 63, 0.75);
  --text-sub: rgba(69, 12, 63, 0.6);

  /* Typography */
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background-color: var(--bg);
}

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  line-height: 1.5;
}

.app-container {
  width: 100%;
  max-width: 960px;
  min-height: 640px;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: var(--white);
}

/* Screen Transitions */
.screen {
  display: none;
  width: 100%;
  height: 100%;
  animation: screenFadeIn 0.2s ease-in-out;
}

.screen.active {
  display: flex;
  flex-direction: column;
  flex: 1;
}

@keyframes screenFadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards & Generic Panels */
.card {
  background: var(--panel);
  border: 3px solid var(--panel-border);
  border-radius: 8px;
  padding: 2.25rem;
  box-shadow: 5px 5px 0px var(--dark);
  color: var(--text);
}

.brand-badge {
  display: inline-block;
  padding: 0.35rem 0.85rem;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: var(--dark);
  background: var(--pale-2);
  border: 2px solid var(--dark);
  border-radius: 4px;
  margin-bottom: 1rem;
  font-family: var(--font-mono);
}

/* ==========================================================================
   1. Title Screen
   ========================================================================== */
.title-card {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: auto;
  max-width: 720px;
}

.main-title {
  font-size: 3rem;
  font-weight: 900;
  letter-spacing: 0.06em;
  color: var(--dark);
  margin-bottom: 1.75rem;
  font-family: var(--font-mono);
}

.menu-actions {
  display: flex;
  gap: 1.25rem;
  width: 100%;
  max-width: 620px;
  margin-bottom: 2rem;
}

/* Buttons */
.btn {
  border: 2px solid var(--dark);
  border-radius: 6px;
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
  font-family: inherit;
  box-shadow: 3px 3px 0px var(--dark);
}

.btn:hover {
  background-color: var(--pale-2);
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0px var(--dark);
}

.btn:active {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px var(--dark);
}

.btn-large {
  flex: 1;
  padding: 1.25rem 1.5rem;
  text-align: left;
}

.btn-primary {
  background: var(--accent);
  color: var(--dark);
}

.btn-primary:hover {
  background: var(--pale-2);
}

.btn-secondary,
.btn-outline {
  background: var(--pale-1);
  color: var(--dark);
}

.btn-secondary:hover,
.btn-outline:hover {
  background: var(--pale-2);
}

.btn-danger-outline {
  background: var(--white);
  color: var(--dark);
  border: 2px solid var(--dark);
}

.btn-danger-outline:hover {
  background: var(--pale-2);
}

.btn-small {
  padding: 0.45rem 0.9rem;
  font-size: 0.82rem;
}

.btn-icon {
  font-size: 1.2rem;
  font-weight: 900;
  font-family: var(--font-mono);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--white);
  border: 2px solid var(--dark);
  border-radius: 4px;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
}

.btn-content {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.btn-title {
  font-size: 1.2rem;
  font-weight: 900;
  color: var(--dark);
}

.btn-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 700;
}

.version-tag {
  font-size: 0.75rem;
  color: var(--text-sub);
  font-family: var(--font-mono);
  font-weight: 600;
}

/* ==========================================================================
   2. Setup Screen
   ========================================================================== */
.setup-card {
  max-width: 720px;
  margin: auto;
}

.section-title {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--dark);
  margin-bottom: 0.5rem;
}

.section-desc {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 1.75rem;
  font-weight: 600;
}

.difficulty-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-bottom: 2rem;
}

.diff-card {
  position: relative;
  background: var(--white);
  border: 2px solid var(--dark);
  border-radius: 6px;
  padding: 1.25rem;
  cursor: pointer;
  box-shadow: 3px 3px 0px var(--dark);
  transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
}

.diff-card:hover {
  background: var(--pale-1);
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0px var(--dark);
}

.diff-card input[type="radio"] {
  position: absolute;
  top: 0.85rem;
  right: 0.85rem;
  accent-color: var(--dark);
}

.diff-card:has(input:checked) {
  border: 3px solid var(--dark);
  background: var(--pale-2);
  box-shadow: 4px 4px 0px var(--dark);
}

.diff-header {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  margin-bottom: 0.5rem;
}

.diff-name {
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--dark);
}

.vehicle-tag {
  font-size: 0.75rem;
  color: var(--dark);
  background: var(--accent);
  border: 1px solid var(--dark);
  border-radius: 3px;
  padding: 0.1rem 0.4rem;
  font-weight: 800;
  display: inline-block;
  width: fit-content;
}

.diff-info {
  font-size: 0.85rem;
  color: var(--text);
  margin-bottom: 0.75rem;
  font-weight: 600;
}

.diff-specs {
  display: none; /* Removed internal technical numbers per Section 29 & 60 */
}

.setup-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn-launch {
  padding: 0.9rem 2.25rem;
  font-size: 1.15rem;
}

/* ==========================================================================
   3. Gameplay Screen
   ========================================================================== */
#screenGame {
  position: relative;
  background: var(--panel);
  border: 3px solid var(--dark);
  border-radius: 8px;
  padding: 1.5rem;
  min-height: 580px;
  box-shadow: 5px 5px 0px var(--dark);
}

/* Ready Overlay */
.ready-overlay {
  position: absolute;
  inset: 0;
  background: rgba(245, 251, 218, 0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  border-radius: 6px;
}

.ready-overlay.active {
  display: flex;
}

.ready-count {
  font-size: 6rem;
  font-weight: 900;
  color: var(--dark);
  font-family: var(--font-mono);
  animation: pulseScale 0.8s infinite;
}

@keyframes pulseScale {
  0% { transform: scale(1.15); opacity: 0.8; }
  50% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.9; }
}

/* HUD */
.game-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 0.85rem;
  border-bottom: 2px solid var(--dark);
  margin-bottom: 1rem;
}

.hud-left {
  display: flex;
  gap: 0.5rem;
}

.hud-badge {
  padding: 0.35rem 0.75rem;
  font-size: 0.8rem;
  font-weight: 900;
  border-radius: 4px;
  border: 2px solid var(--dark);
  background: var(--white);
  color: var(--dark);
}

.mode-badge { background: var(--accent); color: var(--dark); }
.diff-badge { background: var(--pale-2); color: var(--dark); }
.stage-badge { background: var(--white); color: var(--dark); }

.hud-center {
  text-align: center;
}

.hud-timer-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--white);
  border: 2px solid var(--dark);
  border-radius: 4px;
  padding: 0.2rem 1rem;
}

.hud-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-weight: 800;
}

.hud-timer-val {
  font-size: 1.75rem;
  font-weight: 900;
  font-family: var(--font-mono);
  color: var(--dark);
}

.hud-timer-box.critical-warning {
  animation: timerPulse 0.5s infinite alternate;
}

@keyframes timerPulse {
  0% { background-color: var(--white); }
  100% { background-color: var(--pale-2); }
}

.hud-right {
  display: flex;
  gap: 1.5rem;
}

.hud-stat-box {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.hud-val {
  font-size: 1.35rem;
  font-weight: 900;
  font-family: var(--font-mono);
  color: var(--dark);
}

/* ==========================================================================
   PIXEL ART VISUAL SCENE VIEWPORT (WHITE BACKGROUND / 5-COLOR PALETTE)
   ========================================================================== */
.scene-panel {
  background: var(--white);
  border: 2px solid var(--dark);
  border-radius: 6px;
  padding: 0.65rem;
  margin-bottom: 1.25rem;
}

.scene-status-bar {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
  font-family: var(--font-mono);
  font-weight: 700;
}

.visual-scene-container {
  width: 100%;
  height: 180px;
  background: var(--white);
  border: 2px solid var(--dark);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  image-rendering: pixelated;
}

.visual-scene-viewport {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* 1. Sky Layer (Realistic Sky Blue) */
.scene-sky-layer {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 125px;
  background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 75%, #F0F9FF 100%);
  z-index: 1;
}

/* 1.2 Rainbow Background Overlay Layer */
.scene-rainbow-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 900px;
  height: 135px;
  z-index: 1;
  pointer-events: none;
}

.extra-rainbow-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* 1.5 Progressive City Panorama */
.scene-city-panorama-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 900px;
  height: 135px;
  z-index: 2;
  pointer-events: none;
}

.city-panorama-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* 1.8 Airborne Dynamic EXTRA Events Layer */
.scene-extra-dynamic-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 900px;
  height: 135px;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}

.extra-dynamic-item {
  pointer-events: none;
}

/* 2. Horizon & Fence Silhouette */
.scene-horizon-fence {
  position: absolute;
  top: 116px;
  left: 0;
  right: 0;
  height: 10px;
  background: repeating-linear-gradient(
    90deg,
    #64748B 0px,
    #64748B 2px,
    transparent 2px,
    transparent 12px
  );
  border-bottom: 2px solid #475569;
  z-index: 3;
}

/* 3. Yard Ground & Road */
.scene-road-ground {
  position: absolute;
  top: 125px;
  left: 0;
  right: 0;
  bottom: 0;
  background: #94A3B8;
  border-top: 3px solid #334155;
  z-index: 4;
}

.road-lane-stripes {
  position: absolute;
  top: 24px;
  left: 0;
  right: 0;
  height: 3px;
  background: repeating-linear-gradient(
    90deg,
    #F8FAFC 0px,
    #F8FAFC 20px,
    transparent 20px,
    transparent 40px
  );
}

/* 4. Truck Layer */
.scene-truck-layer {
  position: absolute;
  right: 15px;
  top: 65px;
  z-index: 10;
  pointer-events: none;
}

/* 5. Forklift Layer */
.scene-forklift-layer {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 20;
  pointer-events: none;
  transition: transform 0.05s linear;
}

/* 6. Active Load Layer */
.scene-active-load-layer {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 25;
  pointer-events: none;
}

/* 7. Effects Layer */
.scene-effects-layer {
  position: absolute;
  inset: 0;
  z-index: 30;
  pointer-events: none;
}

.effect-container {
  animation: popFade 0.4s ease-out forwards;
}

@keyframes popFade {
  0% { transform: scale(0.5); opacity: 1; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Pixel Shakes */
.shake {
  animation: pixelShake 0.18s ease-in-out infinite;
}

@keyframes pixelShake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-3px, 1px); }
  75% { transform: translate(2px, -1px); }
}

/* ==========================================================================
   Prompt & Typing Area
   ========================================================================== */
.typing-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  margin-bottom: 1rem;
}

.feedback-banner {
  position: absolute;
  top: -12px;
  font-size: 1.15rem;
  font-weight: 900;
  font-family: var(--font-mono);
  letter-spacing: 0.12em;
  opacity: 0;
  transition: opacity 0.15s ease;
  padding: 0.2rem 0.8rem;
  border-radius: 4px;
}

.feedback-banner.success {
  color: var(--dark);
  background: var(--pale-2);
  border: 2px solid var(--dark);
  opacity: 1;
}

.feedback-banner.miss {
  color: var(--dark);
  background: var(--pale-1);
  border: 2px solid var(--dark);
  opacity: 1;
}

.prompt-display {
  font-size: 2.25rem;
  font-weight: 900;
  color: var(--dark);
  margin-bottom: 0.35rem;
}

.prompt-reading {
  font-size: 1.2rem;
  color: var(--text-muted);
  margin-bottom: 1.15rem;
  font-weight: 700;
}

.target-container {
  width: 100%;
  max-width: 680px;
}

.target-box {
  background: var(--white);
  border: 3px solid var(--dark);
  border-radius: 6px;
  padding: 1.15rem;
  font-size: 1.75rem;
  font-family: var(--font-mono);
  letter-spacing: 0.12em;
  word-break: break-all;
  box-shadow: 3px 3px 0px var(--dark);
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

.target-typed {
  color: var(--dark);
  background: var(--pale-2);
  border-bottom: 2px solid var(--accent);
  font-weight: 900;
}

.target-remaining {
  color: var(--dark);
  font-weight: 700;
}

.target-box.flash-error {
  animation: flashMistake 0.2s ease-in-out;
}

@keyframes flashMistake {
  0%, 100% { border-color: var(--dark); background: var(--white); }
  50% { border-color: var(--dark); background: var(--pale-2); border-width: 4px; }
}

/* Footer */
.game-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 2px solid var(--dark);
  padding-top: 0.85rem;
}

/* ==========================================================================
   4. Result Screen
   ========================================================================== */
.result-card {
  max-width: 720px;
  margin: auto;
  text-align: center;
}

.result-title {
  font-size: 2.25rem;
  font-weight: 900;
  color: var(--dark);
  margin-bottom: 1.25rem;
}

.result-score-box {
  background: var(--white);
  border: 3px solid var(--dark);
  border-radius: 6px;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 1.75rem;
  box-shadow: 3px 3px 0px var(--dark);
}

.result-score-label {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-weight: 900;
  letter-spacing: 0.12em;
}

.result-score-number {
  font-size: 3.25rem;
  font-weight: 900;
  font-family: var(--font-mono);
  color: var(--dark);
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.85rem;
  margin-bottom: 1.75rem;
  text-align: left;
}

.metric-item {
  background: var(--white);
  border: 2px solid var(--dark);
  border-radius: 4px;
  padding: 0.75rem 0.85rem;
  box-shadow: 2px 2px 0px var(--dark);
}

.metric-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  display: block;
  margin-bottom: 0.2rem;
  font-weight: 800;
}

.metric-val {
  font-size: 1.15rem;
  font-weight: 900;
  font-family: var(--font-mono);
  color: var(--dark);
}

.result-actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
}

/* ==========================================================================
   Phase 8: Player Name Input & Cloud Score Persistence
   ========================================================================== */
.setup-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 1.5rem;
  width: 100%;
}

.setup-label {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--dark);
  margin-bottom: 0.5rem;
  letter-spacing: 0.05em;
}

.player-name-input {
  background: var(--white);
  border: 2px solid var(--dark);
  border-radius: 6px;
  color: var(--dark);
  font-family: var(--font-mono);
  font-size: 1.15rem;
  font-weight: 800;
  padding: 0.65rem 1rem;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 2px 2px 0px var(--dark);
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

.player-name-input:focus {
  outline: none;
  border-color: var(--accent);
  background-color: var(--pale-1);
}

.player-name-input::placeholder {
  color: var(--text-muted);
  font-size: 0.95rem;
  font-weight: normal;
}

.player-name-feedback {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--dark);
  margin-top: 0.4rem;
  min-height: 1.2rem;
}

.hud-player-badge {
  display: flex;
  flex-direction: column;
  background: var(--pale-1);
  border: 1px solid var(--dark);
  border-radius: 4px;
  padding: 0.15rem 0.5rem;
  margin-left: 0.5rem;
  text-align: left;
}

.hud-player-label {
  font-size: 0.55rem;
  font-weight: 900;
  color: var(--text-muted);
  line-height: 1;
}

.hud-player-name {
  font-size: 0.85rem;
  font-weight: 900;
  color: var(--dark);
  font-family: var(--font-mono);
  white-space: nowrap;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.result-save-container {
  background: var(--pale-1);
  border: 2px solid var(--dark);
  border-radius: 6px;
  padding: 0.75rem 1.25rem;
  margin-bottom: 1.5rem;
  box-shadow: 2px 2px 0px var(--dark);
  width: 100%;
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
}

.result-save-status-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
}

.result-save-status {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--dark);
  font-family: var(--font-mono);
}

.retry-submit-btn {
  padding: 0.35rem 0.85rem;
  font-size: 0.85rem;
}

/* ==========================================================================
   Phase 9: Ranking Screen & Components
